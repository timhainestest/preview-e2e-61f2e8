name: Preview E2E (reusable)

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the commit the preview was built from
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the end-to-end suite against the preview
        env:
          PREVIEW_BYPASS_TOKEN: ${{ secrets.PREVIEW_BYPASS_TOKEN }}
          PREVIEW_BYPASS_HEADER: ${{ vars.PREVIEW_BYPASS_HEADER }}
          CONFIG_SIGNING_SECRET: ${{ secrets.CONFIG_SIGNING_SECRET }}
          PREVIEW_URL: ${{ github.event.client_payload.url }}
        run: ./scripts/e2e.sh
